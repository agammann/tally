name: PostgreSQL major-version rehearsal
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'compose.postgres18-restore.yaml'
      - 'compose.postgres17.yaml'
      - 'compose.yaml'
      - 'scripts/rehearse-postgres-18.mjs'
      - 'scripts/test-pg18-startup-guard.mjs'
      - 'scripts/rehearse-pg18-compose.mjs'
      - 'prisma/migrations/**'
      - '.github/workflows/postgres-major-rehearsal.yml'
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run init
      - run: node scripts/rehearse-postgres-18.mjs
      - run: node scripts/test-pg18-startup-guard.mjs
      - run: node scripts/rehearse-pg18-compose.mjs
