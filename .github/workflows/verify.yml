name: Verify Tally
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tally-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run init
      - run: docker compose up -d --wait db
      - name: Record exact disposable integration runtime
        run: |
          mkdir -p work
          {
            git rev-parse HEAD
            node --version
            pnpm --version
            docker --version
            docker compose version
            docker compose exec -T db postgres --version
            docker image inspect postgres:17.9-alpine --format '{{json .RepoDigests}}'
          } > work/integration-runtime.txt
      - run: pnpm db:generate && pnpm db:migrate && pnpm build
      - run: pnpm exec tsc --noEmit && pnpm test && pnpm audit --prod
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start containerized dashboard and production reference
        run: |
          docker compose build app
          docker compose --profile app up -d --wait app
          mkdir -p work
          pnpm --filter tally-reference start > work/reference-server.log 2>&1 &
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
      - run: pnpm test:browser
      - run: pnpm test:integration && pnpm test:independent && pnpm test:operations
      - name: Require real native WebMCP checks
        env:
          TALLY_REQUIRE_NATIVE: '1'
        run: pnpm exec tsx scripts/native-check.ts
      - run: pnpm exec tsx scripts/workflow-boundary.ts && pnpm exec tsx scripts/recovery-check.ts
      - run: pnpm exec tsx scripts/performance.ts
      - run: pnpm run licenses
      - name: Verify release SDK archive
        run: node scripts/package.cjs
      - name: Keep tested SDK release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tally-release
          path: |
            artifacts/tally-local-sdk-*.tgz
            artifacts/tally-local-sdk-*.tgz.sha256
            artifacts/SHA256SUMS
          if-no-files-found: error
          overwrite: true
      - name: Download the uploaded SDK archive
        id: artifact-download-first
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tally-release
          path: ${{ runner.temp }}/tally-release-roundtrip
      - name: Wait for artifact visibility
        if: steps.artifact-download-first.outcome == 'failure'
        run: sleep 10
      - name: Retry SDK artifact download
        id: artifact-download-second
        if: steps.artifact-download-first.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tally-release
          path: ${{ runner.temp }}/tally-release-roundtrip
      - name: Wait for artifact visibility again
        if: steps.artifact-download-second.outcome == 'failure'
        run: sleep 20
      - name: Final SDK artifact download attempt
        if: steps.artifact-download-second.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tally-release
          path: ${{ runner.temp }}/tally-release-roundtrip
      - name: Check downloaded archive hashes
        working-directory: ${{ runner.temp }}/tally-release-roundtrip
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tally-sdk-and-verification
          path: |
            artifacts/*.tgz
            work/integration-runtime.txt
            work/integration-results.json
            work/independent-results.json
            work/operations-results.json
            work/native-results.json
            work/workflow-boundary-results.json
            work/recovery-results.json
            docs/PERFORMANCE.json
            docs/DEPENDENCIES.json
      - if: always()
        run: docker compose --profile app down --volumes --remove-orphans
  publish:
    name: Publish verified release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tally-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read assets from this verified run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tally-release
          path: release-artifacts
      - name: Publish complete SDK assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const publish = require('./scripts/release.cjs');
            await publish({ github, context, core });
