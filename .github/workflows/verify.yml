name: Verify Tally
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tally-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run init
      - run: docker compose up -d --wait db
      - name: Record exact disposable integration runtime
        run: |
          mkdir -p work
          {
            git rev-parse HEAD
            node --version
            pnpm --version
            docker --version
            docker compose version
            docker compose exec -T db postgres --version
            docker image inspect postgres:17.9-alpine --format '{{json .RepoDigests}}'
          } > work/integration-runtime.txt
      - run: pnpm db:generate && pnpm db:migrate && pnpm build
      - run: pnpm exec tsc --noEmit && pnpm test && pnpm audit --prod
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start containerized dashboard and production reference
        run: |
          docker compose build app
          docker compose --profile app up -d --wait app
          mkdir -p work
          pnpm --filter tally-reference start > work/reference-server.log 2>&1 &
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
      - run: pnpm test:browser
      - run: pnpm test:integration && pnpm test:independent && pnpm test:operations
      - name: Require real native WebMCP checks
        env:
          TALLY_REQUIRE_NATIVE: '1'
        run: pnpm exec tsx scripts/native-check.ts
      - run: pnpm exec tsx scripts/workflow-boundary.ts && pnpm exec tsx scripts/recovery-check.ts
      - run: pnpm exec tsx scripts/performance.ts
      - run: pnpm run licenses
      - name: Verify release SDK archive
        run: node scripts/package.cjs
      - name: Keep tested SDK release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tally-release
          path: |
            artifacts/tally-local-sdk-*.tgz
            artifacts/tally-local-sdk-*.tgz.sha256
            artifacts/SHA256SUMS
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tally-sdk-and-verification
          path: |
            artifacts/*.tgz
            work/integration-runtime.txt
            work/integration-results.json
            work/independent-results.json
            work/operations-results.json
            work/native-results.json
            work/workflow-boundary-results.json
            work/recovery-results.json
            docs/PERFORMANCE.json
            docs/DEPENDENCIES.json
      - if: always()
        run: docker compose --profile app down --volumes --remove-orphans
  publish:
    name: Publish verified release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tally-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read assets from this verified run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tally-release
          path: release-artifacts
      - name: Publish complete SDK assets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const publish = require('./scripts/release.cjs');
            await publish({ github, context, core });
