name: tally-private
services:
  db:
    image: postgres:18.4-alpine
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -n "$$(ls -A /tally-legacy)" ] && [ "$${TALLY_PG18_RESTORE:-}" != 1 ]; then
          marker=/var/lib/postgresql/.tally-pg18-restored
          if [ ! -f "$$marker" ] || [ -L "$$marker" ] || [ "$$(cat "$$marker")" != 'tally-pg18-restore-v1' ]; then
            echo 'Existing PostgreSQL 17 data detected. Follow the PostgreSQL 18 migration instructions before starting the database.' >&2
            exit 1
          fi
        fi
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    command: ['postgres']
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm init}
      POSTGRES_DB: tally
    ports: ['127.0.0.1:55487:5432']
    volumes:
      - tally-data:/tally-legacy:ro
      - tally-data-pg18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U tally -d tally']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    restart: unless-stopped
  migrate:
    image: tally-private-app:1.0.1
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tally:${POSTGRES_PASSWORD}@db:5432/tally?schema=public
    command: ['pnpm','db:migrate']
    depends_on:
      db: {condition: service_healthy}
    profiles: [app]
  app:
    image: tally-private-app:1.0.1
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tally:${POSTGRES_PASSWORD}@db:5432/tally?schema=public
      NODE_ENV: production
    ports: ['127.0.0.1:3000:3000']
    command: ['pnpm','--filter','tally-dashboard','start:container']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD','node','-e',"fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    init: true
    stop_grace_period: 30s
    mem_limit: 1536m
    restart: unless-stopped
    profiles: [app]
volumes:
  tally-data:
  tally-data-pg18:
