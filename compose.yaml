name: tally-private
services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm init}
      POSTGRES_DB: tally
    ports: ['127.0.0.1:55487:5432']
    volumes: [tally-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tally -d tally']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    restart: unless-stopped
  migrate:
    image: tally-private-app:0.1.0
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tally:${POSTGRES_PASSWORD}@db:5432/tally?schema=public
    command: ['pnpm','db:migrate']
    depends_on:
      db: {condition: service_healthy}
    profiles: [app]
  app:
    image: tally-private-app:0.1.0
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tally:${POSTGRES_PASSWORD}@db:5432/tally?schema=public
      NODE_ENV: production
    ports: ['127.0.0.1:3000:3000']
    command: ['pnpm','--filter','tally-dashboard','start:container']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD','node','-e',"fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    init: true
    stop_grace_period: 30s
    mem_limit: 1536m
    restart: unless-stopped
    profiles: [app]
volumes:
  tally-data:
